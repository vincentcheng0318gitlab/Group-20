name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: typo-guard lints its own code
        run: typo-guard lint src tests --allowlist .typo-guard-words
      - name: Demo file is still detected (expects exit code 1)
        shell: bash
        run: |
          set +e
          typo-guard lint examples/example.py
          test $? -eq 1
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
